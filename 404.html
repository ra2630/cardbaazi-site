<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · CardBaazi</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0a141e; color: #fff; max-width: 520px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    a { color: #f5d061; font-weight: bold; }
  </style>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var joinAt = parts.indexOf('join');
      var prefix = parts[0] === 'cardbaazi-site' ? '/cardbaazi-site/' : '/';
      if (joinAt !== -1 && parts[joinAt + 1] && parts.length === joinAt + 2) {
        var code = parts[joinAt + 1];
        if (code && code !== 'index.html' && code !== 'join.html') {
          var params = new URLSearchParams(location.search);
          params.set('code', decodeURIComponent(code));
          location.replace(prefix + 'join.html?' + params.toString());
          return;
        }
      }
      window.addEventListener('DOMContentLoaded', function () {
        document.getElementById('homeLink').href = prefix;
        document.getElementById('supportLink').href = prefix + 'support.html';
        document.getElementById('joinLink').href = prefix + 'join.html';
      });
    })();
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>That URL is not on this CardBaazi site.</p>
  <p><a id="homeLink" href="/cardbaazi-site/">Home</a> · <a id="supportLink" href="/cardbaazi-site/support.html">Support</a> · <a id="joinLink" href="/cardbaazi-site/join.html">Join a table</a></p>
</body>
</html>
