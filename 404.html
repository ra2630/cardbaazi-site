<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join CardBaazi</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0a141e; color: #fff; max-width: 520px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    a { color: #f5d061; font-weight: bold; }
  </style>
  <script>
    (function () {
      var segments = location.pathname.split('/').filter(Boolean);
      var jAt = segments.lastIndexOf('j');
      var raw = (jAt === -1) ? '' : (segments[jAt + 1] || '');
      var prefix = '/';
      if (jAt > 0) prefix = '/' + segments.slice(0, jAt).join('/') + '/';
      else if (segments[0] && segments[0] !== 'j' && segments[0] !== 'join.html') prefix = '/' + segments[0] + '/';

      if (raw && raw !== 'index.html' && !/\.html?$/i.test(raw)) {
        try { raw = decodeURIComponent(raw); } catch (e) {}
        var params = new URLSearchParams(location.search);
        params.set('code', raw);
        location.replace(prefix + 'join.html?' + params.toString());
        return;
      }

      window.addEventListener('DOMContentLoaded', function () {
        document.getElementById('homeLink').href = prefix;
        document.getElementById('supportLink').href = prefix + 'support.html';
        document.getElementById('joinLink').href = prefix + 'join.html';
      });
    })();
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>That URL is not on this CardBaazi site.</p>
  <p><a id="homeLink" href="./">Home</a> · <a id="supportLink" href="support.html">Support</a> · <a id="joinLink" href="join.html">Join a table</a></p>
</body>
</html>
